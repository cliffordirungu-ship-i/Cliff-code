<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Example</title>
</head>
<body>
    <h1>Subject registration form</h1>
    <p>Select your fav subject</p>
    <form>
        <input type="checkbox" name="subject" value="ICT">ICT
        <br>
        <input type="checkbox" name="Subject" value="Mathematics">Mathematics
        <br>
        <input type="checkbox" name="subject" value="Biology">Biology
        <br>
        <input type="checkbox" name="subject" value="Chemistry">Chemistry
        <br><br>
    </form>
</body>
</html>
