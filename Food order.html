
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Ordering Form</title>

    <style>
        body {
            background-color: lightyellow;
        }

        button[type="submit"] {
            background-color: blue;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }

        button[type="submit"]:hover {
            background-color: green;
        }
    </style>
</head>

<body>

    <h1 style="color: darkgreen;">MY FOOD ORDER</h1>

    <form>
        <input type="checkbox" value="Chapati" name="food">
        Chapati
        <br>

        <input type="checkbox" value="Rice" name="food">
        Rice
        <br>

        <input type="checkbox" value="Ugali" name="food">
        Ugali
        <br>

        <input type="checkbox" value="Chicken" name="food">
        Chicken
        <br>

        <input type="checkbox" value="Fish" name="food">
        Fish
        <br><br>

        <button type="submit">Submit</button>
    </form>

</body>
</html>
