<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        table,th, td {
            border: 4px solid rgb(160, 203, 33);
            border-collapse:collapse;
        }
        th,td {
              text-align: left;
              margin:20px;
              padding: 10px;
        }
        tr:nth-child(even) {
            background-color: rgb(203, 203, 33);
        }
        td:nth-child(even) {
            background-color: rgb(33, 203, 33);
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Students Timetable</h1>
    <table style="width:100%;">
        <caption>Timetable for the week</caption>
        <tr>
            <th>Day</th>
            <th>8:00-10:00</th>
            <th>10:00-12:00</th>
            <th>1:00-3:00</th>
        </tr>
        <tr>
            <td>Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>Practical</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Networking</td>
            <td>HTML</td>
            <td>Lab</td>
        </tr>
        <tr>
            <td>Wednesday</td>
            <td>CSS</td>
            <td>Practical</td>
            <td>Revision</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>HTML</td>
            <td>Networking</td>
            <td>Lab</td>
        </tr>
        <tr>
            <td>Friday</td>
            <td>Revision</td>
            <td>Assessment</td>
            <td>Project</td>
        </tr>
    </table>
</body>
</html>
