<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"My ICT Website"</title>
    <style>
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #44cf79;
        }
        li {
            float: left;
            width:100px;
        }
        li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px;
            text-decoration: none;
        }
        li a:hover {
            background-color: #1e87bb;
        }
    </style>
    </head>
    <body>
        <h2>Navigation Menu</h2>
        <p>We use CSS to style our navigation menu.</p>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </body>
    </html>
