<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login pages</title>
</head>
<body>
    <H1>login pages form</H1>
    <form>
        <label for="username">username:</label>
        <input type="text" id="username" name="username"required>
        <br><br>
        <label for="password">password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        <label for="forgot password">forgot password</label>
        <input type="text" id="forgot password" name="forgot password" required>
        <br><br>
        <label for="reset new password">reset new password</label>
        <input type="text" id="reset new password" name="reset new password" required>
        <br><br>
        <label for="remember me">remember me</label>
        <input type="text" id="remember me" name="remember me">
        <br><br>
        <button type="submit">submit</button>
        <button type="reset">reset</button>
    </form>
</body>
</html>
